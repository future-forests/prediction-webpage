## INTRO

Predictions serve two goals: addressing practical, applied questions with stakeholders,
AND advancing scientific understanding of a system by falsifying causal predictions.

There is a philosophical difference between predictions in applied and fundamental science. Only under very specific conditions 
is prediction science, in particular when it achieves validation of structure. 

Newcomers may want orientation, this resource aims to provide it.

Predictions use models, hence quite a bit of this orientation touches on modelling. It does so, somewhat obscurely, in 
<a href=#modelling>Stage 3</a> under "<a href=#identifying-models>Building trust in model</a>". The reason is that in this context the modelling steps primarily serve to justify the 
choice of the model(s). How to model, and which model to use when is discussed under "<a href=#bones>Bones of contention</a>".

A model is a flexible thing here: it can be a set of expert statements, a process model, or a deep-learning analysis. 
A prediction is a quantitative statement of a model, including forecasts and projections.

As a teaser, here are a few points to ponder:

A "context" explanation points to a system defined too narrowly, and may lead eventually to incompressible system descriptions if everything always remains context-dependent. 

Keep the long-term view of science in mind.

The quality of predictions is currently unknown due to lack of uncertainty quantification.



## PHASES

=== 1. Setting the stage: Why predict? #setting-stage

ROLE Modeller + Stakeholder
RATIONALE

This step specifies the actual prediction target and the context in which the prediction is to be evaluated.

Specifying the prediction target - including the quantities to be predicted, the relevant drivers, and the spatial, temporal, and organizational scales of interest - defines the scope of the prediction problem. This determines which processes and data are relevant, ensures that the model, available data, and prediction objective are aligned, constrains model complexity to what is required, and provides an early opportunity to assess whether the necessary information exists before substantial modeling effort is invested.

--- Specific question #specific-question
ROLE  Stakeholder
TEXT The prediction target is defined <i>jointly</i> by stakeholder and modeller, to ensure that the prediction is useful to the stakeholder and feasible as model target. 

For example, a stakeholder may want to know the effect of building a dam on malaria infection rates, but the modeller has no ability to quantify malaria transmissions near stagnant water bodies. Then a prediction task seems infeasible 🛑

--- Target that can be modelled and observed #target-modelled
TEXT The prediction target has to be <i>observable</i> in order to allow comparison of model and real world. (For example, "environmental health" is no suitable target of a model prediction, while "bird species richness" or "tick density" are. Vague targets indicate unclear question and lead to arbitrary decisions.)

At this point, also the precision required should be specified. Is it enough to know the flooding level up to a 95%-confidence interval of 1 m? Would knowing the distribution of an introduced mosquito carrying an infectious disease to the nearest 50 km x 50 km pixel on a map be sufficient? If not: 🛑

--- Scenario planning: Are imaginable results useful to the question? #scenario-planning
TEXT Stakeholders have to <i>imagine prediction</i> results and evaluate whether these would be useful to them (“What's the point of knowing the answer?”). Minimal useful prediction precision has to be specified. If it is not useful, there is no point in making the prediction. 

For example, if a prediction is only useful if it shows unambiguously the superiority of solution A, then there is a high risk of the prediction being useless: uncertainty may be too large or A may not be the best solution, or only marginally so. Is it really useful? Or: if the decision is a foregone conclusion, predicting is a waste of time 🛑

EXAMPLE 🪏 Worked example (fisheries)
How much fish biomass can be extracted from this region of the ocean next year and remain below maximum sustainable yield?
Yields: specific question to be addressed by predictions; identified specific prediction target(s) and required precision; clear usefulness whatever the prediction will be.


=== 2. Identifying data and modelling approaches #identifying-data
ROLE Modeller
RATIONALE This step explores whether data and modelling approaches are available to allow predicting the system and target identified in the previous step to a degree useful for answering the question.

--- Are necessary <i>data of sufficient quality</i> are available? No: 🛑 #data-available
TEXT Data requirements depend on the scale and precision of the desired prediction. When only rough estimates are needed, also coarse or older data may suffice. If a model needs to be developed, parameterised, and validated, there must be sufficient data for several iterations (see <a href=#long-term-planning>long-term planning</a>). When the model needs to be developed, data are required not only for the overall modelled state variable, but for each of the model's components or modules; if those are from other sources, can these sources be assumed to be useful for the question at hand? 

For example, if a tree-growth model uses a nutrient acquisition model from another tree in another ecosystem, possibly a local data set must be found to re-calibrate the module parameters and support model inversion.

LINK validation

--- Select / develop modelling approaches matching question and data #modelling-approaches
TEXT Rarely is there only one right type of model. Depending on expertise, time, money, required realism, very different approaches are worth considering:

  >>> 📋 Expert statements #expert-statements
    Form a commission to evaluate data based on their knowledge and make quantitative statements with uncertainty estimates, incl. minority opinions.

    General references: <sup class="cite-ref" data-cite="West 1997">,</sup> <sup class="cite-ref" data-cite="Hastie 2009">,</sup> <sup class="cite-ref" data-cite="Barber 2012">,</sup> <sup class="cite-ref" data-cite="Hyndman 2021">,</sup> <sup class="cite-ref" data-cite="Bishop 2024"></sup>
  >>> 🤖 Machine/Deep-Learning, Statistical model #ml-dl
    Data-driven, no constraints prediction approaches.
  >>> 🔢 (O/P)DE #o-p-de
    Rigorous mathematical structure for dynamic systems in continuous time (Ordinary or Partial Differential Equations) or discrete time (Difference Equations), possibly with stochastic elements and/or external events or forcings.

    A key advantage is that a rich mathematical tradition and toolbox exists to analyse such models even across a wider range of parameters. However, many such analyses assume equilibrium conditions, while we may be facing predictions out of equilibrium ("transient dynamics"). Still, even when simulated as forward model, ODE/DE are well-understood model types with excellent software support.
  >>> ⚙️ Coded process model, incl. agent-based model #coded-process
    Mathematical model implementation with flexibility in specification, allowing, e.g., for rules, thresholds, strict conditions. Require many often arbitrary decisions WRT implementational details; see model characteristics below.
  >>> 👥 other #other
    [text]

TEXT If multiple approaches a possible: do we have resources to use several of them? If not, justify final choice (“everybody else uses it” is not a valid justification: <a target="_blank" href="https://en.wikipedia.org/wiki/Argumentum_ad_populum">argumentum ad populum</a>). Ideally, we additionally include a simple alternative approach (to quantify effect of model choice arbitrariness, model structural uncertainty.) Ensure that we have the necessary competence to implement the approach. Identify weaknesses of this approach and strategies to overcome them. Identify colleagues to help us. If this is all new to us: 🛑 

--- Specify required model characteristics #specify-model
TEXT  The prediction purpose of <a href=#setting-stage>Stage 1</a> may be specific enough to narrow down the implementation with respect to the following characteristics. If not, here are few questions that may help select among the opposites listed below:

<ol>
  <li>Is the purpose to explore a proof-of-principle or strategy?</li>
  <li>Model as repository of knowledge or as Unix philosophy: "Do one thing, and do that well."</li>
  <li>Will the model be fitted?</li>
  <li>Is there clear demonstration in the literature that a certain approach is necessary, e.g. resolution, complexity?</li>
  <li>Are you familiar with some but not other approaches? This is a poor but common guide!</li>
  <li>Shall the model quantify equilibrium or transient dynamics?</li>
  <li>Do you have many or few data?</li>
  <li>Is your understanding of system and model components very complete?</li>
</ol>

In case of doubt, the simpler version may be preferable:

IMPORTANT 🔔 Upscale of microlevel processes.

  >>> 🗺️ Spatially implicit / explicit #spatially-implicit
      [text]
  >>> 🎲 Stochastic/deterministic #stochastic-deterministic
      [text]
  >>> ⏱️ Continuous/Discrete time #continuous-discrete
      [text]
  >>> 🐟 Discrete individuals/continuous biomass #discrete-individuals-continuous-biomass
      [text]
  >>> 🔄 With / without feedback #with-without
      [text]
  >>> 📐 Explicit management intervention rules #explicit-management
      [text]

TEXT Any of these decisions affects the prediction and its uncertainty. Using only one of the many possible combinations already leads to optimistic error bars, as it ignores model structural uncertainty (or model approach uncertainty). Ideally, several model types are used. <sup class="cite-ref" data-cite="Dormann 2018"></sup>


--- Long-term planning #long-term-planning
TEXT This prediction is often part of a longer activity and commitment. Think through the next years and far beyond the current prediction activity. Think of all resources: stakeholder willingness, data availability, computational resources, developer time. Plan this prediction with a longer-term plan in your mind.
  >>> 👩‍🔬 Efficient use of experts and stakeholders #efficient-use
      All stakeholders require tactful handling, including not wasting their time on unnecessary meetings and deliberations. They probably must be employed for question framing and interpretation (first and last step of this Orientation), but will develop fatigue if over-used. 
  >>> 📊 Data for many validations in the modelling cycle #data-validations
      Any model development step needs to be evaluated on <i>independent data</i>, otherwise the model will be tailored to that specific data set. For a model development over, say, 10 cycles, 11 independent data sets need to be available, or approximated by creating stratified subsets.<sup class="cite-ref" data-cite="Roberts 2017"></sup>
  >>> 💻 Computational resources #computational-resources
      Is it realistic do carry out the anticipated computations, incl. debugging cycles, sensitivity and uncertainty analyses, multiple parameterisations (in case of equifinality), model calibrations? If the model runs for longer than 1 min, ensure availability of HPC resources for at least 10<sup>6</sup> -10<sup>7</sup> runs.




 
=== 3. Modelling #modelling
ROLE Modeller
RATIONALE Before the prediction comes the establishment of the prediction routine, at the technical and at the academic level. The goal of this step is to have a model that can be trusted to make the specific prediction required, and the technical infrastructure necessary to do so. (This section contains the majority of technical detail.)

--- Establish workflow for running models #establish-workflow
TEXT
Any model used for prediction will need to be re-run many times (e.g. in <a href=#sensitivity-analysis> sensitivity analysis</a> or <a href=#uncertainty-analysis>uncertainty analysis</a>, or in <a href=#model-inversion>model inversion</a>, or as part of model development's debugging). A pipeline to easily run the prediction machinery is essential for efficient work, to launch it on HPC, and it also helps with documentation and reproducibility.

The pipeline may be a simple script in a higher-level language or in bash; or it may link in formal <a target="_blank" href="https://en.wikipedia.org/wiki/Scientific_workflow_system">scientific workflow software</a>. Open-source software is preferable; versioning is mandatory.

This technical aspect is essential for running models thousands of times automatically, for using different training data sets, and applying the model to different input data. If no workflow can be established: 🛑

--- Identifying trustworthy models #identifying-models
  TEXT These steps are <i>necessary</i> but not sufficient to develop trust in a model. If you cannot identify a model that can be trusted to make the prediction: 🛑

  General references: <sup class="cite-ref" data-cite="Schmolke 2010"></sup> <sup class="cite-ref" data-cite="Getz 2018"></sup>
  
  >>> &#9730; Code verification/unit testing #code-verification
      Coded models should be checked to be working correctly. This is important in model development (and there often referred to as <a target="_blank" href="https://en.wikipedia.org/wiki/Unit_testing">"unit testing"</a>), but also for users of models: we want to make sure that the model does what it is supposed to do.

      The essential step to do so is by defining test cases, where the correct output of the model component is known; unless the model produces this known output, it is faulty. In advanced software development, unit testing is automatised and carried out after every major modification of code (e.g. for <a target="_blank" href="https://testthat.r-lib.org">R</a>, <a target="_blank" href="https://docs.python.org/3/library/unittest.html">Python</a>, <a target="_blank" href="https://www.geeksforgeeks.org/software-testing/embedded-c-cpp-unit-testing-basics">C++</a>). Unit testing is necessary but not sufficient for code verification; other elements of testing need to be considered as well (<a target="_blank" href="https://en.wikipedia.org/wiki/Software_testing">scalability, maintainability, performance</a>).

  >>> &#9730; Is model "rich" enough? #model-rich
    Extreme events are often of particular relevance in environmental predictions, yet they are difficult to predict. One reason is that the statistical noise around a prediction, based on the unexplained variance in the validation data, may follow a distribution with "<a href="https://en.wikipedia.org/wiki/Heavy-tailed_distribution">heavy tails"</a>.  Such distributions are very difficult to distinguish from those with normal, thin tails, and are thus not typically used when fitting models Examples include the <a href="https://en.wikipedia.org/wiki/Generalized_extreme_value_distribution">Generalised Extreme Value distribution</a>, <a href="https://en.wikipedia.org/wiki/L%C3%A9vy_distribution">Lévy distribution</a>, <a href="https://en.wikipedia.org/wiki/Zipf%E2%80%93Mandelbrot_law">Zipf-Mandelbrot "law"</a> or <a href="https://en.wikipedia.org/wiki/Log-logistic_distribution">log-logistic distribution</a>.<sup class="cite-ref" data-cite="Taleb 2008"></sup> As a result, even a perfectly predicted mean would not yield realistic extremes, unless combined with such heavy-tailed error distributions.

    Another reason why extremes are under-predicted is that the models underlying them are not extreme enough in their dynamics. For example, if a positive feedback is omitted, the system will develop too linearly and is not "rich" enough to show radical dynamics. In economics models of too "poor" endogenous dynamics are blamed for the inability of mainstream models to instantiate extreme boom-and-bust phenomena, which the real world regrettable exhibits<sup class="cite-ref" data-cite="Farmer 2024"></sup>].

    A third reason for lack of extremes in prediction are too moderate drivers, i.e. too weak scenarios. Since these scenarios are generated by models themselves, this is just a version of the previous points applied to scenario-generating models. When selecting or developing a model for prediction, it seems a good idea to explore whether it is able to yield at least as extreme predictions as those contained in the observations. If not, a more dynamic model may be more useful. 

    When prediction is about a real world system, so is the model from which it is derived. Thus, the underlying model must be able to reproduce relevant features and dynamics of that real world system. To do so, its dynamics must be "rich" enough = sufficiently powerful = covering enough of the feature space of the system under consideration.

<!---For example, typical models of the financial market are unable to produce the kind of bubbles and bursts we witnessed in the 1920 and 2008 
<i>from endogenous dynamics</i>. But, as Farmer<sup class="cite-ref" data-cite="Farmer 2024"></sup> argued, the 2008 bubble was mostly internal. So, for such a system we need a feedback-rich 
complex adaptive system representation, in economics, in biology, in medicine, in environmental science. Only if the model can have peaks of the 
same order of magnitude as those observed, if response-times are quick (or drawn out) enough, if ranges of patterns can be produced that 
include the observed, only then is the model likely to be "rich" enough to also include the system under consideration.--->



  >>> &#9730; Parameterisation #parameterisation
  <!---ROLE Modeller + stakeholder--->
    It seems an ideal of (environmental) modelling that all model parameters are physically/chemically/biologically interpretable. For such parameters, field and lab measurements can be used to state values for the parameter in the model. This is the "parameterisation" of a model.

    Unobservable model parameters and processes ("latent parameters/processes") cannot be determined by measurement. 
    Some of these are (sometimes disrespectfully) referred to as "fudge factors", particularly if they cannot be scientifically interpreted. Their value can be found by, formally or informally, "tuning" them to make the overall model reproduce the desired patterns. The formal way would use <a href=#model-inversion>inverse modelling</a>.

    One of the design decisions about model characteristics is particularly pertinent to parameterisation: is the model a repository of knowledge or a "Do one thing and do that well." (DOTADTW) A repository inevitable needs to represent alternative formulations of a process, when the knowledge has not condensed yet (think: different ways to represent water uptake by plants). A DOTADTW "only" needs to work well for the system state under consideration, with no attention to processes further away from the target process. A repository-style model with rarely be fit-able to data; literature/field/lab-derived parameter values (and their uncertainty) are the norm.

    General references: <sup class="cite-ref" data-cite="Sun 2015"></sup>


  >>> &#9730; Sensitivity analysis (global vs local) #sensitivity-analysis
      Starting from a default parameterisation, changing any parameter affects the outputs of the model. 
      The systematic exploration of how sensitive output is to parameter changes is the subject of sensitivity analysis (SA). 
      Changing a parameter \(p\), say, 10% up and down yields changes in \(\hat{y}\). The relative change (\(\frac{\Delta \hat{y}}{\Delta p}\)) 
      is the "elasticity" of \(\hat{y}\) with respect to \(p\). This elasticity may well be non-linear, i.e. a 20% increase has a stronger or weaker effect than twice that of a 10% change in \(p\), or an increase has a different elasticity than a decrease of \(p\).

      Of course, the effect of changing \(p\) depends on the values of all other model parameters. Looking at one parameter at a time is called "local" SA, while exploring all parameters simultaneously is referred to as "global" SA. The latter is usefully presented as a "Morris-plot", with average local elasticities on the x-axis, and the standard deviation of sensitivities across changes in the other parameters on the y-axis.

      There is a Morris plot for each model output, as a parameter may be important for one state variable than another. A bit of care must be taken when doing SA, to ensure a reasonable range and distribution of parameter values is trialled; the original equal-spaced uniform sampling of Morris is outdated, and random or Latin hypercube sampling from the parameters prior distribution have replaced it.

      SA provides a quantification of which parameter (and hereby implied which process) is relevant for a model output. When fitting or tuning a model, one may initially ignore insensitive parameters to facilitate finding useful parameter value distributions.
  
      Arguably, SA is one of the most important scientific information about a model: it states which processes in a model are actually responsible for an observed pattern. For complicated models, although "it is all in the code", the joint effects of several processes feed-backing onto each other cannot be intuited unless through SA. Thus, when no SA is available for a model, this is typically the first step users takes to familiarise themselves with that model. Ideally, a graph would show the marginal effect (with confidence interval) of each model parameter for each model output over the range of plausible values ("effect plot").

      Sensitivity analysis is a well-established modelling activity. There are different frameworks (Morris, Sobol', Bayesian and machine-learning-based), differing in efficiency and ability to accommodate the shape of the parameters' PDF and the correlation among parameters.

General references: <sup class="cite-ref" data-cite="Sun 2015"></sup>

<!---
  >>> 🌐 Global SA #global-sa
      Varies all parameters simultaneously across their full range.
  >>> 📍 Local SA #local-sa
      Varies one parameter at a time around a nominal value.
-->


>>> &#9730; Model inversion, Calibration #model-inversion
    
  Statistical models are full data-driven, while process models traditionally are idealised as "forward models", where all parameters are known and immutable. In reality, they were to a smaller or larger extent tuned to data and patterns. Such tuning is often done as part of model development.

  In contrast, model inversion is applied to a finished model, and mean re-estimating the model parameters based on target data. This ensures a maximal suitability of that model for describing <i>these</i> data, albeit at the potential expense of generality.

  Model inversion serves several purposes, most importantly:

    <ol>
      <li> Identify structural errors in the model.
      <li> Improve representation of observations.
      <li> Improve predictions from model by reducing bias.
    </ol>

  Model inversion requires some technical overhead to "invert" the model (see details). Optimising multiple criteria is the key challenge. Computation effort may be prohibitive for large models.
  
  On the other hand, model outputs are sometimes biased or systematically distorted and require, well, calibrating (in the sense of a calibration curve in chemistry). That is fully accepted in statistics (although not necessarily in machine learning<sup class="cite-ref" data-cite="Dormann 2020"></sup>), and model inversion is seeping gradually into fields such as cosmology<sup class="cite-ref" data-cite="Akeret 2015"></sup> and economics.<sup class="cite-ref" data-cite="Lux 2022"></sup>

    IMPORTANT 🔔 Calibration is really useful.
    LINK validation



  >>> &#9730; Uncertainty analysis #uncertainty-analysis
    Uncertainty analysis (UA)<sup class="cite-ref" data-cite="Committee 2012"></sup> aims at representing the consequences of all sources of variation on the prediction (data, model structure, model parameters, model stochasticity, initial values, scenarios, and so forth<div class="cite-ref" data-cite="Dormann 2026"></div>). Methods to propagate uncertainty through a model-and-prediction-pipeline include bootstrapping, Taylor expansions and Bayesian modelling.<sup class="cite-ref" data-cite="Taylor 1997"></sup> <sup class="cite-ref" data-cite="Benaroya 2005"> </sup><sup class="cite-ref" data-cite="Wolter 2007"></sup> Typically UA results in a probability distribution (PDF), summarised e.g. by mean or median and 95% confidence interval. In contrast to raw model residuals (i.e. difference between point prediction and observation), PDFs allow expressing residuals in relation to the prediction uncertainty, e.g. as percentiles or as z-score.

    After quantifying prediction uncertainty, three follow-up steps may follow: (1) an analysis of the sources of uncertainty ("uncertainty decomposition"), using ANOVA or variable-importance-based approaches. If test/validation data are available: (2) quantification of expected prediction error (based on raw residuals of prediction to test data, e.g. RMSPE); and (3) computation of some measure of prediction quality based on the PDF (log-likelihood, or, if no assumption about the PDF shall be made, by CPRS<sup class="cite-ref" data-cite="Matheson 1976"></sup>). The last step can be extended to compute prediction limits.<sup class="cite-ref" data-cite="Wesselkamp 2025"></sup>

    IMPORTANT 🔔 Validation needs to be planned: split data into MANY subsets.

    
    >>> &#9730; Validation #validation
      Independent validation is an honest estimate of prediction quality. "Independent" here means in particular that the data used for validation are not correlated with those used for training/parameterising the model. 

      The most obvious non-independence are due to proximity in space, time or some form of grouping. For example, two adjacent points in an (autocorrelated) time series are not independent, two adjacent (spatially autocorrelated) samples in space are not independent, and neither are two animals sampled from the same group or two species in the same branch of a phylogeny. This means that an independent validation data set must be created such that it samples beyond the range of spatial/temporal/grouping autocorrelation of the raw data.<sup class="cite-ref" data-cite="Roberts 2017"></sup> The most common form of validation, using random assignment of data to different validation folds, is thus often invalid.<sup class="cite-ref" data-cite="Bahn 2013"></sup> <sup class="cite-ref" data-cite="Ploton 2022"></sup>

      In a more subtle way, non-independence also arises because modellers learn from each other, lean on common descriptions of a process, develop their model on the basis of a previous one and use the same global patterns as targets for their models. For any given process model, the data used <i>indirectly</i> to derive model formulations and parameters are unknown. This has two implications: (1) model comparisons can not be used to assess the validity of a model, as it is unknown how distant these two models actually are; (2) hindcasting-validation is thrown into doubt, as it is unclear how much of these "data from the past" have already informed the current model version.

      <small>For example, the 2018 drought wave in central Europe exposed an inability of forest growth models to trace the observed dynamics.<sup class="cite-ref" data-cite="Fischer 2025"></sup> In response, forest growth modelling groups updapted the process descriptions in their models (pers. comm.). If now the 2018 observations can be approximated by hindcasting, this is <i>not</i> a proper validation, as the data have already been used to inform the model formulation or parameterisation.</small>

      General references: <sup class="cite-ref" data-cite="Roberts 2017"></sup> <sup class="cite-ref" data-cite="Cerqueira 2020"></sup>

      IMPORTANT 🔔 Validation needs to be planned: split data into MANY subsets.
      LINK long-term-plan

    >>> &#9730; Documentation of model: code, development, unit testing, validation, usage #documentation-model
      Documentation serves transparency of the science and use of the model. LLMs may be usefully employed to support documentation (particularly of code and use). In some fields, documentation standards exist (e.g. ODD<sup class="cite-ref" data-cite="Grimm 2010"></sup>; TRACE<sup class="cite-ref" data-cite="Schmolke 2010"></sup>).

      <ol>
       <li>Code documentation: what is each element of the code doing?<sup class="cite-ref" data-cite="Swannack 2025"></li>
       <li>Development: Versioning, allowing rollback to earlier version in case of bugs. Which data sets have been used for which model component?</li>
        <li>Unit testing: how is code evaluated for correct working, which tests are actually implemented?</li>
        <li>Validation: which data sets have been used to validate the model? How well did the model do? What are the prediction uncertainty levels derived from this validation?</li>
        <li>Use: How can the model be used, how can predictions be made? This typically takes the form of one or several tutorials.</li>
      </ol>

      General references: <sup class="cite-ref" data-cite="Grimm 2010"></sup>, <sup class="cite-ref" data-cite="Schmolke 2010"></sup>, <sup class="cite-ref" data-cite="Swannack 2025"></sup>






=== 4. Predicting #predicting
ROLE Modeller
RATIONALE This is the actual act of creating a quantitative “conditional” statement based on the model(s). “Conditional” means that the statement depends on the input provided; for scenarios the prediction would then be “projections”, for short term the prediction would be a “forecast”. The actual prediction products may need to be tailored to the stakeholder, but as scientific output they must adhere to some expected standards.

--- Best answer with uncertainty indication #best-answer
TEXT The answer to the question identified in <a href=#setting-stage>Stage 1</a> is the main point of this entire work. Due to the uncertainty in the various steps of modelling (model structure, input, initial states, parameters, options, stochasticity: produced in <a href=#modelling>Stage 3</a>), there will not be a single answer, but a range of answers. In addition to giving a "best guess" (which could be, e.g., the mean, median, mode or a robust statistic), also the uncertainty must be quantified. Arguably, uncertainty quantification is tedious and long-winding, but without a probability distribution of the prediction, one cannot judge the quality and relevance of the prediction itself.

Ideally, the answer is a PDF; knowing the distribution of uncertainty allows using it in decision making. If that is not possible, it should be something like the 95%-confidence interval (or equivalent in robust or Bayesian statistics). After transformation to normality, also the signal-to-noise ratio ("how many sigmas is the result?") may be a reasonable. When using maps to communicate predictions, it may be advisable to hash pixels proportional to their uncertainty.

For many questions, the error bars may widely exceed the signal, thereby indicating that our current knowledge is insufficient for making "useful" statements. A decomposition of uncertainty can help pinpoint the main sources of uncertainty, motivating future science. General references: <sup class="cite-ref" data-cite="Kaye 2012"></sup> <sup class="cite-ref" data-cite="Spiegelhalter 2025"></sup>

EXAMPLE 🪏 Worked example (fisheries)
  How much fish biomass can be extracted from this region of the ocean next year and remain below maximum sustainable yield?
IMPORTANT 🔔 Uncertainty quantification is mandatory.
  Co-interpretation of results and their uncertainty — PDF, also on maps — is required.

--- Plausibility check #plausibility-check
TEXT The credo for this step is: "I don't want to look like a fool." To avoid embarrassment, predictions should be checked for plausibility. Apart from internal consistency (Can that much soil actually erode away? Do trees grow that fast?), the comparison with published data is an important step. If the prediction is widely outside previous observations, they may still be correct, but being an outlier certainly warrants double-checking model(s), data, parameters and scenarios.

If predictions survive double-checking but still "feel wrong", it is particularly important to communicate the assumptions behind modelling approach, the model code and parameterisation. Also the (Mahalanobis) distance between training and prediction data can be quantified to illustrate how unusual the prediction situation is.

--- Uncertainty decomposition #uncertainty-decomp
TEXT The sources of uncertainty for a given prediction indicate our lack of knowledge, thereby giving real-world context to when prediction are reliable. For example, a major uncertainty in Earth System Models (and Global Circulation Models and atmospheric models) is how clouds respond to climate change and thus affect temperature and precipitation. That in itself suggests that (a) cloud formation requires careful parameterisation, and (b) maybe long-term cloud behaviour can be described phenomenological even without physical understanding.

In a similar way, uncertainty decomposition delineates areas of relative robust and more uncertain knowledge. Uncertainty decomposition: one cannot take model elements (or drivers) as irrelevant unless demonstrated to be irrelevant for this prediction.

Use ANOVA- or randomforest-importance-like decomposition (Note: Shapley and PDP have different meaning for correlated input, somewhat like type I and III for ANOVA).
IMPORTANT 🔔 Always use several models for structural uncertainty.





=== 5. Utilisation #utilisation
ROLE Modeller + Stakeholder
RATIONALE [text]

--- Joint interpretation #communication
TEXT What the prediction means should be anticipated in <a href=#setting-stage>Stage 1</a>.
However, given the various steps the prediction-making has gone through, the user should not be left alone with the prediction. In particular the interpretation of uncertainty around the mean prediction, and the attribution of uncertainty to different sources demands clarity. 

Ideally, the user should do the interpretation, that is, do the talking. It will give the predictor the chance to learn where communication is difficult, which elements are easily misunderstood, which communication strategy has (not) worked and so forth. Upon this user interpretation, a round of „clarification in dialogue“ may prove helpful. 
Ideally, a user/modeller joint statement could form the final product of the user/modeller collaboration.

  >>> 📢 Communicate #communicate
      [text]
  >>> ↩️ Feedback #feedback
      [text]

--- Use / exploit prediction #use-exploit-prediction
TEXT How the prediction is used should be known from the (<a href=#setting-stage>start</a>). 
If the prediction of the size of an endangered population under different management types clearly indicates one over the other, decision makers may want to use this predictive assessment.

If the different management options overlap in their predicted effect (given the uncertainty of the prediction), the ideal decision falls into the field of <a href="https://en.wikipedia.org/wiki/Decision_theory">decision science</a>, but the job of prediction is done.

EXAMPLE 🪏 Worked example (fisheries)
  How much fish biomass can be extracted from this region of the ocean next year and remain below maximum sustainable yield?

TEXT Further modifications of models, new data for the next period, continuous engagement of stakeholders.

## GLOSSARY
model | A flexible thing: can be a set of expert statements, a process model, or a deep-learning analysis.
prediction | A quantitative statement of a model; includes forecasts and projections.
calibration | Fitting model parameters to observed data; equivalent to inverse modelling. Distinct from validation.
validation | An honest, pre-planned test of predictive quality on data not used in calibration.
SA | Sensitivity Analysis — identifies which parameters most strongly influence the target output.
ABM | Agent-Based Model — simulates individual entities and their interactions to produce system-level patterns.
ODE | Ordinary Differential Equation — describes continuous-time dynamics of system state variables.
MSY | Maximum Sustainable Yield — the largest catch that can be taken from a stock indefinitely.
PDF | Probability Density Function — the full distribution of a predicted quantity, encoding uncertainty.
MCMC | Markov Chain Monte Carlo — samples posterior parameter distributions in Bayesian calibration.
ABC | Approximate Bayesian Computation — likelihood-free inference for complex simulators.
POM | Pattern-Oriented Modelling — calibration using multiple observed patterns simultaneously.
structural uncertainty | Uncertainty from not knowing the correct model structure; addressed by using multiple model types.
scenario planning | Generating predictions under a range of plausible future conditions to explore assumption sensitivity.

<b>Key questions</b>

<em>Purpose:</em> Why is the prediction needed, who will use it, and what decision or action will it inform?

<em>Prediction target:</em> Which quantities should be predicted? At what spatial, temporal, and organizational scales, and over what prediction horizon? Which drivers and processes are expected to determine the target?

<em>Feasibility:</em> Can the target quantity be observed or measured for model development and evaluation? Are sufficient data, knowledge, and other resources available? Are the intended scenarios and assumptions within the domain where the model is expected to be valid? How good does a prediction need to be to be "useful" in a particular context? No prediction papers ever address this. How good can we reasonably expect our prediction to be given the current data set and its limitations? Hence, how much effort needs to be put into getting better data.

<em>Performance requirements:</em> What level of accuracy and uncertainty is acceptable for the intended application?

<em>Assumptions and scope:</em> What simplifying assumptions are necessary, and how might they affect the interpretation and applicability of the predictions?
